# Local Postgres 16 (+pgvector) and Redis for development.
# Defaults are local-only dev values; override via .env (see .env.example).
#   make db-up / make db-down

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: earnings-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-earnings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-earnings}
      POSTGRES_DB: ${POSTGRES_DB:-earnings}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: earnings-redis
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
