name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image and local-only credentials as docker-compose.yml, so the
      # Makefile's default DATABASE_URL works unchanged.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: earnings
          POSTGRES_PASSWORD: earnings
          POSTGRES_DB: earnings
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U earnings -d earnings"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make migrate
      - run: make test

  web:
    name: Web · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen  # глобальные PageProps / LayoutProps — без них tsc в чистом CI падает
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  secrets-scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
