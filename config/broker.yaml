# Брокер и модель издержек (SPEC §6, §17 п.3, п.5). Смена брокера — только здесь и в adapters/broker/.
broker: manual                   # manual | ib | freedom (ib, freedom — фаза 5, T22)

costs:
  # MVP: ордера ставит человек у своего брокера. Какого — не решено (OPEN_QUESTIONS); ставки пока как у IB.
  manual:
    commission_per_share: 0.005          # IBKR Pro Fixed, акции США (сайт IBKR, 14.10.2026)
    min_commission_per_stock_order: 1.0  # там же
    max_commission_stock_fraction: 0.01  # там же: не больше 1% суммы сделки
    commission_per_contract: 0.65        # IBKR Pro Fixed, опционы США (там же)
    min_commission_per_option_order: 0.0 # минимум для опционов не подтверждён — OPEN_QUESTIONS
    open_slippage: 0.001                 # проскальзывание на открытии 0,1% — стартовое допущение, калибруется по исполнениям (T21)
    assumed_spread_stock: null           # без котировки — DataError, не угадываем
    assumed_spread_option: null          # Options Starter без котировок: нужно решение заказчика — OPEN_QUESTIONS
  ib:
    commission_per_share: 0.005
    min_commission_per_stock_order: 1.0
    max_commission_stock_fraction: 0.01
    commission_per_contract: 0.65
    min_commission_per_option_order: 0.0
    open_slippage: 0.001
    assumed_spread_stock: null
    assumed_spread_option: null
  # freedom: тариф Freedom (Tradernet) не проверен — добавить при выборе брокера (T22).
