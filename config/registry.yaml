# Реестр плагинов. Ядро не знает имён — только этот файл (SPEC §7).
# Стадии: shadow → paper → live_small → live. Вверх — только командой `promote`.
# stage здесь — начальная стадия: текущая хранится в БД (таблица plugin), её меняет только promote
# (решение заказчика 14.10.2026). runs: event — конвейер события, schedule — своя задача планировщика.
# enabled: false — плагин ещё не реализован; включает задача, которая его пишет.

plugins:
  # --- Агенты данных (SPEC §8, реализация — T09, T14) ---
  - {id: calendar,    kind: agent, version: 0.1.0, stage: paper,  enabled: true,  runs: schedule}   # T09
  - {id: sector,      kind: agent, version: 0.1.0, stage: paper,  enabled: true,  runs: event}   # T14a
  - {id: dossier,     kind: agent, version: 0.1.0, stage: paper,  enabled: true,  runs: event}   # T14c
  - {id: consensus,   kind: agent, version: 0.1.0, stage: paper,  enabled: true,  runs: event}   # T14b
  - {id: positioning, kind: agent, version: 0.1.0, stage: paper,  enabled: true,  runs: event}   # T14a
  - {id: macro,       kind: agent, version: 0.1.0, stage: paper,  enabled: true,  runs: event}   # T14a
  - {id: options,     kind: agent, version: 0.1.0, stage: paper,  enabled: true,  runs: event}   # T14b
  # доступ к Polymarket из юрисдикции заказчика не подтверждён (OPEN_QUESTIONS.md)
  - {id: polymarket,  kind: agent, version: 0.1.0, stage: shadow, enabled: false, runs: event}

  # --- Стратегии (SPEC §17 п.4, реализация — T16) ---
  - {id: mode_a,            kind: strategy, version: 0.1.0, stage: shadow, enabled: true,  runs: event}  # T16; shadow — бэктеста режима A не было
  - {id: mode_b,            kind: strategy, version: 0.1.0, stage: shadow, enabled: true,  runs: event}  # T16; shadow до 30+ наблюдений с Brier лучше базового
  - {id: mode_c,            kind: strategy, version: 0.1.0, stage: paper,  enabled: true,  runs: event}  # T16; правила бэктеста T12b
  - {id: straddle,          kind: strategy, version: 0.1.0, stage: paper,  enabled: false, runs: event}  # T16; выключен 21.10.2026: бэктест EV −0,145, Sharpe −1,05 (reports/backtest_2026-10-14.md)
  - {id: iron_condor,       kind: strategy, version: 0.1.0, stage: paper,  enabled: false, runs: event}  # T16; выключен 21.10.2026: бэктест EV +0,005, сырой P&L −$6 563 (reports/backtest_2026-10-14.md)
  - {id: polymarket_binary, kind: strategy, version: 0.1.0, stage: shadow, enabled: false, runs: event}
