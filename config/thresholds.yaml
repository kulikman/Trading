# Пороги, лимиты и стартовые веса. Источник — SPEC.md §7, §9, §10, §17 и решения заказчика.
# Код чисел не содержит: всё читается через core.config. Доли — от 0 до 1 (0.03 = 3%).
# null = ограничение отключено решением заказчика.

capital:
  module_usd: 100000                 # решение заказчика 2026-10-13

sizing:                              # SPEC §10
  # Риск на сделку (доля капитала) = kelly_multiplier · (p·b − (1−p)) / b,
  # p — вероятность модели, b = W/L по истории конструкции.
  # Чем выше p, тем больше риск; при p·b ≤ 1−p риск 0 — сделки нет.
  kelly_multiplier: 0.25
  kelly_multiplier_seasons_1_2: 0.125
  # b, пока у конструкции меньше models.min_segment_obs закрытых сделок (правило 30) —
  # решение заказчика 2026-10-13.
  kelly_initial_b: 1.0
  # Объём позиции = риск / (stop_implied_moves · implied_move).
  stop_implied_moves: 2.0
  max_risk_per_trade: null           # без потолка — решение заказчика 2026-10-13
  # Сбор данных в сезоны 1–2 (решение заказчика 15.10.2026: «широкая воронка, сужаем по данным»): paper-стратегии
  # входят по своему сигналу без порога edge и θ, риск — фиксированная доля капитала, как в бэктесте.
  # Edge и уверенность всё равно пишутся в decision_step. Black Swan: красный — вето, жёлтый / оранжевый — множитель.
  data_collection_risk: 0.01

risk_limits:                         # SPEC §10
  cluster_max_positions: null        # сектор × неделя; без лимита — решение заказчика 2026-10-13
  season_max_open_risk: null         # без лимита — решение заказчика 2026-10-13
  losing_streak:
    losses: 5
    pause_hours: 24                  # после паузы — только Paper
  drawdown:
    manual_review: 0.10
    paper_only: 0.15
  black_swan:
    manual_red: false                # ручной красный уровень от заказчика (SPEC §10): true — новых входов нет, снимает сам
    yellow: {size_multiplier: 0.7, min_confidence: null}
    orange: {size_multiplier: 0.4, min_confidence: 0.80}
    red: {size_multiplier: 0.0, min_confidence: null}   # новых входов нет
    # Правило уровня (решение заказчика 13.10.2026) — стартовые гипотезы: проверяются бэктестом (T12b),
    # закрепляются в T16. Уровень — худший из сигналов; повышение сразу, понижение — после спокойных дней подряд.
    rule:
      vix_levels: {yellow: 20.0, orange: 25.0, red: 35.0}   # закрытие VIX (FRED VIXCLS)
      vix_jump: {yellow: null, orange: 0.20, red: 0.40}     # рост VIX за день; жёлтого порога нет
      spy_drop: {yellow: 0.02, orange: 0.04, red: 0.07}     # падение SPY за день или за окно
      spy_drop_window_days: 5
      calm_days_to_downgrade: 2

liquidity:                           # SPEC §10
  max_option_spread: 0.05            # спред опциона < 5% цены
  max_stock_spread: 0.001            # спред акции < 0.1%
  min_atm_pair_volume: 500          # стартовое (E6): медианный объём ATM-пары накануне отчёта — «ликвидные»; только флаг профиля, не фильтр

edge:                                # SPEC §9
  margin_over_costs: 0.03            # сделка при edge > costs + 0.03
  paper_theta_seasons_1_2: 0.50
  exploration_share_seasons_1_2: 0.20

models:                              # SPEC §9, §7, §17
  holdout_fraction: 0.25
  isotonic_min_obs: 300
  min_segment_obs: 30                # правило 30
  feature_budget: 12
  feature_merge_correlation: 0.8
  quarantine:
    max_brier: 0.30
    min_reports: 6
  # Активные признаки «агент.признак» — идут в модели (бюджет feature_budget). Решение заказчика 14.10.2026:
  # 8 из стартовых весов p_up + 3 для модели движения. dossier.* — после T14c (Досье).
  active_features:
    - consensus.revision_trend_7_90
    - sector.peer_surprise_mean
    - sector.trend
    - positioning.short_interest_days
    - options.skew_25d
    - positioning.pre_run_3d
    - dossier.disclosure
    - dossier.guidance_risk
    - options.implied_move
    - options.iv_rank            # IV на той же стадии перед прошлыми отчётами компании (T14b)
    - macro.vix
  # Только до первого `learn season`; дальше веса меняет обучение.
  p_up_initial_betas:
    disclosure: 2.0
    revision_trend: 1.5
    peer_surprise: 1.2
    sector_trend: 0.6
    short_interest: 0.3
    skew: -0.5
    guidance_risk: -0.8
    pre_run: -1.0
  # Стартовая p_up (T15, до первого learn season): вес SPEC §9 → признак и масштаб. Признак делится на масштаб и
  # обрезается до [−1; 1] — веса SPEC действуют соизмеримо. Масштаб — типичный размах признака (наше толкование).
  p_up_feature_map:
    disclosure: {feature: dossier.disclosure, scale: 1.0}                  # −1 / 0 / 1
    revision_trend: {feature: consensus.revision_trend_7_90, scale: 0.10}  # пересмотр консенсуса ±10%
    peer_surprise: {feature: sector.peer_surprise_mean, scale: 0.10}       # средний сюрприз пиров ±10%
    sector_trend: {feature: sector.trend, scale: 1.0}                      # −1 / 0 / 1
    short_interest: {feature: positioning.short_interest_days, scale: 10.0}  # дней покрытия, 10 — много
    skew: {feature: options.skew_25d, scale: 0.10}                         # ±10 п.п. IV
    guidance_risk: {feature: dossier.guidance_risk, scale: 0.10}           # консенсус выше прогноза на 10%
    pre_run: {feature: positioning.pre_run_3d, scale: 0.06}                # +6% за 3 дня — порог PRE_RUN (SPEC §10)
  # Стартовые p_beat и move_ratio — только свободный член по частоте в архиве за этот срок (весов в SPEC нет).
  prior_lookback_days: 1825
  probability_clip: 0.02             # прогнозы и рыночные эталоны — в [0,02; 0,98]

lifecycle:                           # SPEC §7
  promote_min_obs: 30
  live_small_weight: 0.05

modes:                               # SPEC §10
  A:
    max_pre_run_30d: 0.10
    max_vix: 25.0
    min_sector_trend: 0
    stop_atr_multiple: 1.5
    atr_period: 14
  B:
    theta: 0.50                      # стартовое, решение заказчика 2026-10-13; дальше подбирает `learn season`
  C:
    min_eps_surprise: 0.05
    min_revenue_surprise: 0.05
    min_volume_ratio: 2.0
    max_entry_over_vwap: 0.003       # лимит ≤ VWAP первого часа + 0.3%
    trailing_atr_multiple: 2.0
    atr_period: 14
    exit_sma_period: 5
    max_hold_days: 20

pre_run_3d:                          # SPEC §10, «Рост перед отчётом»
  neutral_below: 0.03                # < +3% — без изменений
  skip_above: 0.06                   # > +6% без причины — PRE_RUN
  b_multiplier_3_to_6: 0.5           # +3…+6%: A нет, B × 0.5
  rebound_at_or_below: -0.04         # ≤ −4%: A на отскок
  b_multiplier_rebound: 1.2          # ≤ −4%: B × 1.2 при бычьем сигнале

constructions:                       # SPEC §10
  collar:
    put_otm: 0.05
    call_otm_min: 0.07
    call_otm_max: 0.08
  straddle:
    min_move_ratio: 1.3
    stop_premium_loss: 0.5           # стоп −50% премии
    target_premium_gain: 1.0         # цель +100%
  iron_condor:
    max_move_ratio: 0.75
    stop_premium_multiple: 2.0       # стоп 2× премии
    # Толкование «2× премии» (заказчик 14.10.2026, по бэктесту reports/backtest_2026-10-14.md):
    # loss — закрыть, когда убыток 2× премии (выкуп 3×); cost — когда выкуп стоит 2× премии (убыток 1×).
    # Выбрано loss: EV +0,005 против +0,003, стопов 12 против 28.
    stop_basis: loss
    target_premium_share: 0.5        # цель 50%
    # Страйки (решение заказчика 14.10.2026): продаём колл и пут на 1 implied move от цены,
    # покупаем защиту на 2 implied move — ближайшие существующие страйки.
    short_implied_moves: 1.0
    wing_implied_moves: 2.0
  polymarket:
    min_edge: 0.05                   # недооценка beat ≥ 5 п.п.

data:                                # SPEC §6
  max_price_mismatch: 0.003          # > 0.3% — DATA_MISMATCH

execution:                           # SPEC §1, §11
  no_market_orders_first_minutes: 5
  fill_reminder_minutes: 15

costs:                               # SPEC §17 п.3
  paper_vs_real_alert: 0.20
  min_real_fills: 20                 # T21, стартовое: от 20 реальных исполнений — сообщение и пересчёт

notify:                              # SPEC §12
  watchdog_grace_minutes: 5

backtest:                            # T12, решения заказчика 14.10.2026
  # Исторический ratio = средний |движение| последних отчётов компании / implied move текущего.
  signal_lookback_reports: 8
  signal_min_reports: 4              # меньше прошлых отчётов с движением — сигнала нет
  exit_time_et: "11:00"              # SPEC §10: опционы на отчёт — до 11:00 T0
  open_slippage_minutes: 5           # выход в первые 5 минут сессии — с проскальзыванием на открытии
  risk_per_trade: 0.01               # кривая капитала: фиксированный риск 1% на сделку (Келли — в Paper)
  compare_condor_stops: [cost, loss] # бэктест считает кондор с каждым толкованием стопа
  mode_c:                            # T12b: упрощённый режим C (решение заказчика 14.10.2026) — без выручки и guidance
    decision_time_et: "10:30"        # проверка условий и лимит по VWAP первого часа (09:30–10:30), SPEC §10
    fill_deadline_et: "11:00"        # лимит не исполнен до этого времени — сделки нет
    volume_lookback_days: 20         # «объём > 2× среднего»: первый час против среднего первого часа за 20 дней
    min_volume_history_days: 10      # меньше дней истории объёма — сигнала нет
    assumed_spread_stock: 0.0005     # только бэктест: котировок нет, спред акции 0,05% цены — допущение

agents:                              # T14: параметры агентов данных (SPEC §8)
  sector:                            # «тренд сектора» — решение заказчика 14.10.2026
    season_window_days: 45           # отчёты компаний сектора за последние 45 дней — текущий сезон
    min_peers: 3                     # меньше отчитавшихся — trend = 0
    min_abs_surprise: 0.02           # средний сюрприз EPS по модулю ≤ 2% — trend = 0
    momentum_days: 30                # sector_momentum_30d — средняя доходность компаний сектора за 30 дней
  positioning:
    long_run_days: 30                # pre_run_30d
    short_run_trading_days: 3        # pre_run_3d
    volume_lookback_days: 20         # volume_anomaly — объём вчера / средний за 20 дней
    short_interest_lag_days: 12      # расчёт FINRA публикуется ~через 8 рабочих дней — без заглядывания вперёд
  macro:
    lookback_days: 60                # история VIX и SPY для уровня Black Swan (regime 0–3)
  options:                           # T14b; снимок цепочки (Options Starter с 15.10.2026), запасной путь — дневные цены накануне
    skew_delta: 0.25                 # skew_25d = IV пута 25Δ − IV колла 25Δ ближней экспирации
    term_back_min_days: 28           # term_slope = ATM IV ближней − ATM IV дальней (≥ ближней + 28 дней)
    term_back_window_days: 21        # дальняя ищется в окне ближняя + 28 … + 49 дней
    iv_rank_reports: 8               # iv_rank — по 8 прошлым отчётам (решение заказчика 14.10.2026)
    iv_rank_min_reports: 4           # меньше 4 с ценами в архиве — iv_rank не считается
    history_days: 760                # цены акции и ставка DGS3MO — на глубину архива опционов (2 года)
    rate_max_age_days: 10            # последнее значение DGS3MO не старше 10 дней
  consensus:                         # T14b; Alpha Vantage EARNINGS_ESTIMATES
    min_abs_eps: 0.05                # знаменатель пересмотра и разброса не меньше $0,05 — EPS около нуля
    max_quarter_lag_days: 120        # квартал отчёта — конец не раньше чем за 120 дней до даты отчёта
  dossier:                           # T14c; LLM (config/sources.yaml: llm) — только извлечение фактов и текст для человека
    release_lookback_days: 120       # прошлый пресс-релиз о результатах (8-K п. 2.02) — не старше 120 дней
    # Раскрытия с прошлого отчёта (решение заказчика 14.10.2026): соглашения и сделки, внеплановые итоги, увольнения
    # и смена руководства, Reg FD (часто прогноз на конференции), прочие существенные события.
    disclosure_items: ["1.01", "2.01", "2.02", "2.05", "2.06", "5.02", "7.01", "8.01"]
    max_filings: 8                   # последних подач 8-K
    max_news: 40                     # последних новостей Massive (заголовок + описание)
    max_chars_per_document: 40000    # ≈ 10 тыс. токенов
    max_chars_per_request: 120000    # ≈ 30 тыс. токенов на запрос: ≈ $0,06 на Sonnet 5.5 — расчётно
    release_window_days: 3           # T+1: пресс-релиз подан с дня до отчёта по отчёт + 3 дня
    revenue_sanity_ratio: 2.0        # прогноз выручки в 2+ раза от консенсуса — ошибка единиц, не признак

dashboard:                           # T19a, DASHBOARD.md
  path_to_real:                      # решение заказчика 2026-10-13 (DASHBOARD.md §4.6; SPEC §14, фаза 4)
    min_trades: 50
    min_sharpe: 1.0                  # строго больше
    max_drawdown: 0.15               # строго меньше
    min_paper_days: 30
  balance_divergence: 0.005          # §5: баланс брокера против расчёта системы, старт 0,5%
  cost_divergence: 0.20              # §4.3 строка доверия; тот же порог, что пересчёт CostModel (T21)
  sharpe_min_days: 20                # меньше дней с P&L — Sharpe «мало данных»
  refresh_session_seconds: 60        # §5: полоса счёта, «Сегодня», «Сделки» в основную сессию
  refresh_off_session_seconds: 600   # и вне её
  system_failure_window_hours: 24    # задача события с ошибкой за сутки → шапка «СИСТЕМА: СБОЙ»
