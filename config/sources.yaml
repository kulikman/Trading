# Технические параметры адаптеров источников данных (SPEC §6).
# Секреты (ключи API) здесь не хранятся — только в переменных окружения.
# Значения — стартовые технические настройки, не торговые пороги.

redis:
  timeout_seconds: 0.5          # недоступный Redis — быстрый промах кэша, а не ожидание

massive:
  base_url: https://api.massive.com
  timeout_seconds: 10
  max_attempts: 4              # 1 запрос + 3 повтора при 429 / 5xx / сетевой ошибке
  backoff_base_seconds: 0.5    # паузы 0.5, 1, 2 с
  max_pages: 20                # предохранитель от бесконечной пагинации next_url
  page_limit:                  # максимум по документации Massive
    aggregates: 50000
    option_contracts: 1000
    option_chain: 250
    news: 1000
  cache_ttl_seconds:           # 0 — без кэша
    aggregates: 3600
    last_quote: 0
    snapshot: 15
    option_contracts: 86400    # справочник контрактов обновляется раз в день
    option_chain: 60
    news: 900
  implied_move:
    expiration_lookahead_days: 14   # окно поиска ближайшей экспирации после реакции на отчёт
    # IV выше — почти наверняка проценты вместо долей (единица в документации не указана) → DataError.
    max_plausible_iv: 5.0

finnhub:                         # бесплатный тариф; ключ — FINNHUB_API_KEY (параметр token)
  base_url: https://finnhub.io/api/v1
  consensus_lookahead_days: 30   # окно предстоящих отчётов для ежедневного снимка консенсуса
  calendar_chunk_days: 7         # окно календаря запрашивается кусками (см. calendar_row_cap)
  calendar_row_cap: 1500         # больше строк Finnhub не отдаёт и теряет ранние даты (проверено 14.10.2026); кусок на пределе делится
  timeout_seconds: 10
  max_attempts: 3
  backoff_base_seconds: 1.0
  cache_ttl_seconds:
    earnings_calendar: 3600
    earnings_history: 86400

alphavantage:                    # бесплатно 25 запросов в день; ключ — ALPHAVANTAGE_API_KEY (параметр apikey)
  base_url: https://www.alphavantage.co
  timeout_seconds: 30
  max_attempts: 2
  backoff_base_seconds: 2.0
  calendar_horizon: 3month       # 3month | 6month | 12month
  cache_ttl_seconds:             # долгий кэш бережёт дневной лимит
    earnings_calendar: 43200
    earnings_estimates: 43200
    earnings: 86400

edgar:                           # SEC EDGAR, бесплатно; заголовок User-Agent — SEC_USER_AGENT (название + email, требование SEC)
  data_base_url: https://data.sec.gov
  tickers_url: https://www.sec.gov/files/company_tickers.json
  archives_base_url: https://www.sec.gov/Archives/edgar/data
  timeout_seconds: 20
  max_attempts: 3
  backoff_base_seconds: 1.0
  earnings_release_item: "2.02"  # пункт 8-K «Results of Operations and Financial Condition»
  cache_ttl_seconds:
    tickers: 86400
    submissions: 3600
    company_facts: 86400
  financials:                    # вкладка «Финансы» (DASHBOARD.md §4.5)
    quarters: 8
    quarter_days_min: 80         # длительность факта, которая считается кварталом
    quarter_days_max: 100
    non_additive_metrics: [eps_diluted]   # разницей нарастающих итогов не считаются (Q4 EPS остаётся пустым)
    concepts:                    # варианты тегов us-gaap по порядку предпочтения
      revenue: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, RevenuesNetOfInterestExpense, SalesRevenueNet]
      net_income: [NetIncomeLoss]
      eps_diluted: [EarningsPerShareDiluted]
      operating_income: [OperatingIncomeLoss]
      gross_profit: [GrossProfit]
      operating_cash_flow: [NetCashProvidedByUsedInOperatingActivities]
      capex: [PaymentsToAcquirePropertyPlantAndEquipment]

fred:                            # FRED, бесплатно; ключ — FRED_API_KEY (параметр api_key)
  base_url: https://api.stlouisfed.org
  timeout_seconds: 15
  max_attempts: 3
  backoff_base_seconds: 1.0
  cache_ttl_seconds:
    observations: 3600

llm:                             # Claude API; ключ — ANTHROPIC_API_KEY. Только извлечение признаков и резюме (CLAUDE.md правило 2)
  model: claude-sonnet-5-5       # решение заказчика 14.10.2026 (дешевле Opus: $2 / $10 за 1M токенов)
  effort: medium
  max_tokens: 16000
  max_attempts: 2                # 1 запрос + 1 повтор при ответе не по схеме (SPEC §6)
