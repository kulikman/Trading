# Watchlist — расширенная вселенная для динамического юниверса.
#
# Тикеры здесь НЕ отслеживаются постоянно. Каждое воскресенье 18:00 ET
# агент watchlist-refresh проверяет Finnhub: у кого отчёт на текущей неделе —
# те временно добавляются в активный юниверс до следующего воскресенья.
#
# Критерии включения:
#   1. S&P 500 / Nasdaq 100; ликвидные недельные опционы
#   2. Высокая волатильность на отчётах (движения ≥ 8%)
#   3. Интересный бизнес с понятными метриками
#
# peer_edges не нужны — добавляются вручную в universe.yaml по мере необходимости.

sectors:
  - id: semis_equipment
    name: Оборудование для производства чипов
    key_metrics: [wafer fab equipment revenue, backlog, gross margin, China revenue share]
    macro_sensitivity: [vix, us10y]
    companies:
      - {ticker: AMAT, name: Applied Materials}
      - {ticker: LRCX, name: Lam Research}
      - {ticker: KLAC, name: KLA Corporation}
      - {ticker: ASML, name: ASML Holding}
      - {ticker: TXN, name: Texas Instruments}
      - {ticker: MRVL, name: Marvell Technology}
      - {ticker: ARM, name: ARM Holdings}

  - id: cybersecurity
