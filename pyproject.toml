[project]
name = "earnings-engine"
version = "0.1.0"
description = "Prepares, enters and manages trades around US quarterly earnings reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "pandas-market-calendars>=5.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Code blocks in SPEC/TASKS are illustrative and owned by the customer.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT",
  "DTZ",  # naive datetime is forbidden (CLAUDE.md rule 10)
  "T20",  # no print — structured logging only
  "S",    # bandit security checks
]
# Russian-language docstrings, comments and Telegram templates trip the
# "ambiguous unicode" checks on every Cyrillic letter.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Generated CHECK constraint SQL strings are long and must stay verbatim.
"core/db/migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "core", "adapters", "agents", "strategies", "models", "decision",
  "execution", "notify", "learning", "backtest", "api", "tests",
]

# pandas_market_calendars ships no type information; its use is confined to core/session_guard.py.
[[tool.mypy.overrides]]
module = ["pandas_market_calendars", "pandas_market_calendars.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = [
  "core", "adapters", "agents", "strategies", "models", "decision",
  "execution", "notify", "learning", "backtest", "api",
]
omit = ["core/db/migrations/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
