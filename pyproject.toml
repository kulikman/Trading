[project]
name = "earnings-engine"
version = "0.1.0"
description = "Prepares, enters and manages trades around US quarterly earnings reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Code blocks in SPEC/TASKS are illustrative and owned by the customer.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT",
  "DTZ",  # naive datetime is forbidden (CLAUDE.md rule 10)
  "T20",  # no print — structured logging only
  "S",    # bandit security checks
]
# Russian-language docstrings, comments and Telegram templates trip the
# "ambiguous unicode" checks on every Cyrillic letter.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "core", "adapters", "agents", "strategies", "models", "decision",
  "execution", "notify", "learning", "backtest", "api", "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
